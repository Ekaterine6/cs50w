<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TechFluence Agency</title>
  <link rel="stylesheet" href="styles/style.css" />
  <link rel="icon" type="image/jpg" href="styles/faviconline.jpg" />

  <!-- Inline Styles -->
  <style>
    /* Base styles */
    body {
      margin: 0;
      background-color: #000;
      color: #fff;
      font-family: sans-serif;
      overflow-x: hidden;
    }

    /* Logo and hamburger */
    .top-left-logo {
      position: fixed;
      top: 20px;
      left: 30px;
      z-index: 1000;
    }
    .top-left-logo img.logo {
      width: 140px;
      height: auto;
    }

    .hamburger {
      position: fixed;
      top: 25px;
      right: 30px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 28px;
      height: 22px;
      cursor: pointer;
    }
    .hamburger div {
      width: 100%;
      height: 3px;
      background-color: #fff;
      transition: all 0.3s ease;
    }

    /* Mobile menu overlay */
    .mobile-menu {
      position: fixed;
      top: 0;
      right: -100%;
      width: 250px;
      height: 100%;
      background-color: rgba(0,0,0,0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 30px;
      transition: right 0.4s ease;
      z-index: 999;
    }
    .mobile-menu a {
      color: #00aaff; /* Company blue */
      font-size: 20px;
      text-decoration: none;
      font-weight: bold;
    }

    /* Hero */
    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background-color: #000;
    }

    /* Starry background */
    #star-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    #globe-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Floating buttons */
    .float-btn {
      position: absolute;
      padding: 16px 28px;
      border: 2px solid #00aaff; /* company blue border */
      color: #00aaff; /* company blue text */
      text-transform: uppercase;
      font-weight: bold;
      letter-spacing: 1px;
      text-decoration: none;
      border-radius: 8px;
      transition: all 0.3s ease;
      z-index: 10;
      font-size: 16px;
    }
    .float-btn:hover {
      background-color: #00aaff;
      color: #000;
    }

    .scroll-down {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      font-size: 20px;
      z-index: 10;
    }

    /* Footer */
    .footer {
      background-color: #000;
      color: #fff;
      padding: 40px 20px;
      text-align: center;
      font-size: 14px;
    }
    .footer a {
      color: #fff;
      text-decoration: none;
    }
    .footer a:hover {
      text-decoration: underline;
    }

    .socials {
      margin-top: 15px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }
    .social-btn {
      position: relative;
      padding: 12px 20px;
      border: 1px solid #fff;
      color: #fff;
      text-transform: uppercase;
      font-weight: bold;
      letter-spacing: 1px;
      overflow: hidden;
      transition: color 0.3s ease;
      z-index: 1;
    }
    .social-btn:hover {
      color: #000;
      background-color: #fff;
    }

    .reveal-btn {
      background-color: transparent;
      border: 1px solid #fff;
      color: #fff;
      padding: 10px 16px;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      z-index: 1;
    }

    #email-text {
      margin-top: 10px;
      font-weight: bold;
    }

    .footer-content-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-bottom: 15px;
    }

    .email-reveal-inline {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .fade-in {
      animation: fadeIn 0.4s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .float-btn {
        padding: 12px 20px;
        font-size: 14px;
      }
      .hamburger {
        top: 20px;
        right: 20px;
      }
    }
  </style>

  <!-- Three.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
</head>

<body>
  <!-- Logo -->
  <div class="top-left-logo">
    <img src="styles/logo.png" alt="Logo" class="logo"/>
  </div>

  <!-- Hamburger Menu -->
  <div class="hamburger" id="hamburger">
    <div></div>
    <div></div>
    <div></div>
  </div>
  <div class="mobile-menu" id="mobile-menu">
    <a href="pages/about.html">About</a>
    <a href="pages/services.html">Services</a>
    <a href="pages/careers.html">Careers</a>
    <a href="pages/contact.html">Contact</a>
  </div>

  <!-- Hero Section -->
  <div class="hero">
    <canvas id="star-canvas"></canvas>
    <div id="globe-container"></div>

    <!-- Floating buttons orbiting globe -->
    <a href="pages/about.html" class="float-btn" id="btn-about">About</a>
    <a href="pages/services.html" class="float-btn" id="btn-services">Services</a>
    <a href="pages/careers.html" class="float-btn" id="btn-careers">Careers</a>
    <a href="pages/contact.html" class="float-btn" id="btn-contact">Contact</a>

    <div class="scroll-down">↓ Scroll to Explore</div>
  </div>

  <!-- Footer Section -->
  <footer class="footer">
    <div class="footer-content-row">
      <div class="email-reveal-inline">
        <button class="reveal-btn" onclick="revealEmail()">📧 Email</button>
        <p id="email-text" class="fade-in" style="display: none;">contact@techfluence.agency</p>
      </div>

      <a href="https://www.instagram.com/techfluence.official/" target="_blank" class="social-btn">Instagram</a>
      <a href="https://www.linkedin.com/company/techfluence-agency" target="_blank" class="social-btn">LinkedIn</a>
    </div>
    <p>&copy; 2025 TechFluence Agency. All rights reserved.</p>
  </footer>

  <!-- Scripts -->
  <script>
    // Reveal Email
    function revealEmail() {
      document.getElementById('email-text').style.display = 'block';
    }

    // Hamburger toggle
    const hamburger = document.getElementById('hamburger');
    const mobileMenu = document.getElementById('mobile-menu');
    hamburger.addEventListener('click', () => {
      if (mobileMenu.style.right === '0px') {
        mobileMenu.style.right = '-100%';
      } else {
        mobileMenu.style.right = '0px';
      }
    });

    // -------------------
    // Three.js Globe Setup
    // -------------------
    const container = document.getElementById('globe-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.z = 3;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    const geometry = new THREE.SphereGeometry(1, 64, 64);
    const material = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true });
    const globe = new THREE.Mesh(geometry, material);
    scene.add(globe);

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    // Floating buttons
    const buttons = [
      {el: document.getElementById('btn-about'), angle: 0},
      {el: document.getElementById('btn-services'), angle: Math.PI/2},
      {el: document.getElementById('btn-careers'), angle: Math.PI},
      {el: document.getElementById('btn-contact'), angle: 3*Math.PI/2},
    ];
    const radius = 250;
    const centerX = window.innerWidth / 2;
    const centerY = window.innerHeight / 2;

    function animate() {
      requestAnimationFrame(animate);
      globe.rotation.y += 0.003;

      buttons.forEach(btn => {
        btn.angle += 0.002;
        btn.el.style.left = centerX + radius * Math.cos(btn.angle) - btn.el.offsetWidth/2 + "px";
        btn.el.style.top = centerY + radius * Math.sin(btn.angle) - btn.el.offsetHeight/2 + "px";
      });

      renderer.render(scene, camera);
    }
    animate();

    // -------------------
    // Starry Background
    // -------------------
    const starCanvas = document.getElementById('star-canvas');
    const ctx = starCanvas.getContext('2d');
    starCanvas.width = window.innerWidth;
    starCanvas.height = window.innerHeight;

    let stars = [];
    const numStars = 150;
    for(let i=0;i<numStars;i++){
      stars.push({
        x: Math.random()*starCanvas.width,
        y: Math.random()*starCanvas.height,
        r: Math.random()*2+1,
        dx: (Math.random()-0.5)*0.1,
        dy: (Math.random()-0.5)*0.1,
        shine: Math.random()
      });
    }

    function drawStars(){
      ctx.clearRect(0,0,starCanvas.width, starCanvas.height);
      stars.forEach(s=>{
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
        ctx.fillStyle = `rgba(255,255,255,${s.shine})`;
        ctx.fill();
        s.x += s.dx;
        s.y += s.dy;
        s.shine += (Math.random()-0.5)*0.05;
        if(s.shine<0) s.shine=0;
        if(s.shine>1) s.shine=1;
      });

      // Occasionally shooting star
      if(Math.random()<0.01){
        let sx = Math.random()*starCanvas.width;
        let sy = Math.random()*starCanvas.height/2;
        let length = Math.random()*100+50;
        let angle = Math.random()*Math.PI/4-Math.PI/8;
        for(let i=0;i<length;i++){
          ctx.fillStyle = `rgba(255,255,255,${1-i/length})`;
          ctx.fillRect(sx+i*Math.cos(angle), sy+i*Math.sin(angle), 2, 2);
        }
      }
      requestAnimationFrame(drawStars);
    }
    drawStars();

    window.addEventListener('resize', () => {
      starCanvas.width = window.innerWidth;
      starCanvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
