<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TechFluence Agency</title>
  <link rel="stylesheet" href="styles/style.css" />
  <link rel="icon" type="image/jpg" href="styles/faviconline.jpg" />
  <style>
    /* --- Footer & Buttons --- */
    .footer {
      background-color: #000;
      color: #fff;
      padding: 40px 20px;
      text-align: center;
      font-size: 14px;
    }
    .footer a {
      color: #fff;
      text-decoration: none;
    }
    .footer a:hover {
      text-decoration: underline;
    }
    .socials {
      margin-top: 15px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }
    .social-btn {
      position: relative;
      padding: 12px 20px;
      border: 1px solid #00aaff; /* company blue */
      color: #00aaff;
      text-transform: uppercase;
      font-weight: bold;
      letter-spacing: 1px;
      overflow: hidden;
      transition: color 0.3s ease, background 0.3s ease;
      z-index: 100;
      font-size: 18px;
      border-radius: 6px;
    }
    .social-btn:hover {
      background-color: #00aaff;
      color: #fff;
    }
    .email-reveal {
      margin-top: 15px;
    }
    .reveal-btn {
      background-color: transparent;
      border: 1px solid #00aaff;
      color: #00aaff;
      padding: 10px 16px;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      z-index: 100;
      border-radius: 6px;
    }
    #email-text {
      margin-top: 10px;
      font-weight: bold;
    }
    .footer-content-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-bottom: 15px;
    }
    .email-reveal-inline {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .fade-in {
      animation: fadeIn 0.4s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .top-left-logo {
      position: fixed;
      top: 20px;
      left: 30px;
      z-index: 10000;
    }
    .top-left-logo img.logo {
      width: 140px;
      height: auto;
    }

    /* --- Hero & Globe --- */
    body {
      margin: 0;
      overflow-x: hidden;
      background-color: black;
      position: relative;
      color: #fff;
      font-family: sans-serif;
    }
    #starCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      background-color: black;
    }
    .hero {
      position: relative;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    #globe-container {
      position: relative;
      width: 400px;
      height: 400px;
      z-index: 10;
    }
    canvas#globe {
      width: 100%;
      height: 100%;
      display: block;
    }
    .float-btn {
      position: absolute;
      z-index: 20;
      font-size: 18px;
      font-weight: bold;
      color: #00aaff;
      border: 1px solid #00aaff;
      padding: 10px 16px;
      border-radius: 6px;
      text-decoration: none;
      transition: all 0.3s ease;
    }
    .float-btn:hover {
      background-color: #00aaff;
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- Stars background -->
  <canvas id="starCanvas"></canvas>

  <!-- Top-left logo -->
  <div class="top-left-logo">
    <img src="styles/logo.png" alt="Logo" class="logo"/>
  </div>

  <!-- Hero Section with Globe -->
  <div class="hero">
    <div id="globe-container">
      <canvas id="globe"></canvas>
    </div>

    <!-- Floating Buttons around globe -->
    <a href="pages/about.html" class="float-btn" style="top: 0%; left: 50%;">About</a>
    <a href="pages/services.html" class="float-btn" style="top: 50%; left: 100%;">Services</a>
    <a href="pages/careers.html" class="float-btn" style="top: 100%; left: 50%;">Careers</a>
    <a href="pages/contact.html" class="float-btn" style="top: 50%; left: 0%;">Contact</a>
  </div>

  <!-- Footer Section -->
  <footer class="footer">
    <div class="footer-content-row">
      <div class="email-reveal-inline">
        <button class="reveal-btn" onclick="revealEmail()">📧 Email</button>
        <p id="email-text" class="fade-in" style="display: none;">contact@techfluence.agency</p>
      </div>
      <a href="https://www.instagram.com/techfluence.official/" target="_blank" class="social-btn">Instagram</a>
      <a href="https://www.linkedin.com/company/techfluence-agency" target="_blank" class="social-btn">LinkedIn</a>
    </div>
    <p>&copy; 2025 TechFluence Agency. All rights reserved.</p>
  </footer>

  <!-- Scripts -->
  <script>
    function revealEmail() {
      document.getElementById('email-text').style.display = 'block';
    }

    // --- Stars ---
    const starCanvas = document.getElementById('starCanvas');
    const starCtx = starCanvas.getContext('2d');
    let stars = [];
    function initStars() {
      starCanvas.width = window.innerWidth;
      starCanvas.height = window.innerHeight;
      stars = [];
      for (let i = 0; i < 200; i++) {
        stars.push({
          x: Math.random() * starCanvas.width,
          y: Math.random() * starCanvas.height,
          radius: Math.random() * 1.5 + 0.5,
          alpha: Math.random() * 0.8 + 0.2
        });
      }
    }
    function drawStars() {
      starCtx.clearRect(0, 0, starCanvas.width, starCanvas.height);
      stars.forEach(s => {
        starCtx.beginPath();
        starCtx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        starCtx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
        starCtx.fill();
      });
      requestAnimationFrame(drawStars);
    }
    window.addEventListener('resize', initStars);
    initStars();
    drawStars();

    // --- Globe ---
    const globeCanvas = document.getElementById('globe');
    const globeCtx = globeCanvas.getContext('2d');
    let globeAngle = 0;
    function resizeGlobe() {
      globeCanvas.width = globeCanvas.clientWidth;
      globeCanvas.height = globeCanvas.clientHeight;
    }
    function drawGlobe() {
      globeCtx.clearRect(0, 0, globeCanvas.width, globeCanvas.height);
      const w = globeCanvas.width;
      const h = globeCanvas.height;
      const cx = w/2;
      const cy = h/2;
      const radius = Math.min(w,h)/2 - 10;

      // Globe circle
      globeCtx.strokeStyle = "#fff";
      globeCtx.lineWidth = 2;
      globeCtx.beginPath();
      globeCtx.arc(cx, cy, radius, 0, Math.PI*2);
      globeCtx.stroke();

      // Lines of latitude
      for(let i=1;i<10;i++){
        const r = radius * Math.sin(Math.PI*i/10);
        globeCtx.beginPath();
        globeCtx.ellipse(cx, cy, radius, r, 0, 0, Math.PI*2);
        globeCtx.stroke();
      }

      // Lines of longitude
      for(let i=0;i<20;i++){
        const angle = (Math.PI*2/20)*i + globeAngle;
        globeCtx.beginPath();
        globeCtx.moveTo(cx, cy);
        globeCtx.lineTo(cx + radius*Math.cos(angle), cy + radius*Math.sin(angle));
        globeCtx.stroke();
      }

      globeAngle += 0.002;
      requestAnimationFrame(drawGlobe);
    }

    window.addEventListener('resize', resizeGlobe);
    resizeGlobe();
    drawGlobe();
  </script>

</body>
</html>
