{% extends "auctions/layout.html" %}

{% block body %}
    <h2>Categories</h2>
    <!--Users should be able to visit a page that displays a list of all listing categories. 
    Clicking on the name of any category should take the user to a page that displays all of 
    the active listings in that category.-->
    <ul>
    {% for category in categories %}
        <li><a href="{% url 'cat_listings' category %}"> {{ category }}</a></li>
    {% endfor %}
    </ul>

{% endblock %}
